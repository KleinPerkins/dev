{
  "name": "CI",
  "on": {
    "pull_request": {
      "types": [
        "opened",
        "reopened",
        "synchronize",
        "ready_for_review"
      ]
    },
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "ci-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "owner-contracts": {
      "name": "owner-contracts",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "outputs": {
        "receipt": "${{ steps.verify.outputs.receipt }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install locked source test dependency",
          "run": "python3 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/ci-requirements.txt"
        },
        {
          "name": "Run owner-contracts",
          "id": "verify",
          "env": {
            "CI_HEAD_SHA": "${{ github.event.pull_request.head.sha }}",
            "CI_BASE_SHA": "${{ github.event.pull_request.base.sha }}"
          },
          "run": "python3 -I -B scripts/verify.py shard --shard owner-contracts"
        }
      ],
      "if": "${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}"
    },
    "doc-warden": {
      "name": "doc-warden",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "outputs": {
        "receipt": "${{ steps.verify.outputs.receipt }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install locked source test dependency",
          "run": "python3 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/ci-requirements.txt"
        },
        {
          "name": "Install pinned Node 24 source-test dependency",
          "run": "set -euo pipefail\ntest \"$(uname -m)\" = x86_64\nruntime_root=\"$(mktemp -d \"$RUNNER_TEMP/dev-node.XXXXXX\")\"\narchive=\"$runtime_root/archive.tar.xz\"\ntrap 'rm -f \"$archive\"' EXIT\ncurl --fail --location --proto '=https' --tlsv1.2 --max-time 120 https://nodejs.org/dist/v24.22.3/node-v24.22.3-linux-x64.tar.xz --output \"$archive\"\nprintf '%s  %s\\n' '4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb' \"$archive\" | sha256sum --check --strict\ntar -xJf \"$archive\" -C \"$runtime_root\" --strip-components=1\ntest \"$(\"$runtime_root/bin/node\" --version)\" = 'v24.22.3'\nprintf '%s\\n' \"$runtime_root/bin\" >> \"$GITHUB_PATH\""
        },
        {
          "name": "Run doc-warden",
          "id": "verify",
          "env": {
            "CI_HEAD_SHA": "${{ github.event.pull_request.head.sha }}",
            "CI_BASE_SHA": "${{ github.event.pull_request.base.sha }}"
          },
          "run": "python3 -I -B scripts/verify.py shard --shard doc-warden"
        }
      ],
      "if": "${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}"
    },
    "baseline-scaffold": {
      "name": "baseline-scaffold",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "outputs": {
        "receipt": "${{ steps.verify.outputs.receipt }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install locked source test dependency",
          "run": "python3 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/ci-requirements.txt"
        },
        {
          "name": "Run baseline-scaffold",
          "id": "verify",
          "env": {
            "CI_HEAD_SHA": "${{ github.event.pull_request.head.sha }}",
            "CI_BASE_SHA": "${{ github.event.pull_request.base.sha }}"
          },
          "run": "python3 -I -B scripts/verify.py shard --shard baseline-scaffold"
        }
      ],
      "if": "${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}"
    },
    "host-overlay-lifecycle": {
      "name": "host-overlay-lifecycle",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "outputs": {
        "receipt": "${{ steps.verify.outputs.receipt }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install locked source test dependency",
          "run": "python3 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/ci-requirements.txt"
        },
        {
          "name": "Install pinned scanner parity dependency",
          "run": "set -euo pipefail\nscanner_package=\"$(mktemp \"$RUNNER_TEMP/ripgrep.XXXXXX.deb\")\"\ntrap 'rm -f \"$scanner_package\"' EXIT\ncurl --fail --location --proto '=https' --tlsv1.2 --max-time 60 https://archive.ubuntu.com/ubuntu/pool/universe/r/rust-ripgrep/ripgrep_14.1.0-1_amd64.deb --output \"$scanner_package\"\nprintf '%s  %s\\n' 'c5ae63c7bee915b1cfc9f0bd07c55b4ce7f2bcd1133cba4da56719aac26101a4' \"$scanner_package\" | sha256sum --check --strict\nsudo dpkg --install \"$scanner_package\"\ntest \"$(dpkg-query --show --showformat='${Version}' ripgrep)\" = '14.1.0-1'\nrg --version"
        },
        {
          "name": "Run host-overlay-lifecycle",
          "id": "verify",
          "env": {
            "CI_HEAD_SHA": "${{ github.event.pull_request.head.sha }}",
            "CI_BASE_SHA": "${{ github.event.pull_request.base.sha }}"
          },
          "run": "python3 -I -B scripts/verify.py shard --shard host-overlay-lifecycle"
        }
      ],
      "if": "${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}"
    },
    "interop-portability": {
      "name": "interop-portability",
      "runs-on": "macos-15",
      "timeout-minutes": 30,
      "outputs": {
        "receipt": "${{ steps.verify.outputs.receipt }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Install pinned Darwin Python 3.12.12",
          "run": "set -euo pipefail\n# Standard macos-15 selects ARM64; macos-15-intel selects Intel.\n# GitHub runner reference: https://docs.github.com/en/actions/reference/runners/github-hosted-runners\n# Observed arm64 check and aarch64 runtime execution: https://github.com/KleinPerkins/dev/actions/runs/44053184227/job/133935806106\ntest \"$(uname -m)\" = arm64\nruntime_root=\"$(mktemp -d \"/private/tmp/dev-python.XXXXXX\")\"\narchive=\"$runtime_root/archive.tar.gz\"\ntrap 'rm -f \"$archive\"' EXIT\ncurl --fail --location --proto '=https' --tlsv1.2 --max-time 120 https://github.com/astral-sh/python-build-standalone/releases/download/20260127/cpython-3.12.12%2B20260127-aarch64-apple-darwin-install_only_stripped.tar.gz --output \"$archive\"\nprintf '%s  %s\\n' 'ce209e54ac17f731b5f257ff419b55a445fcf65035e303bbbc5708d67dfe59d8' \"$archive\" | shasum -a 256 --check\ntar -xzf \"$archive\" -C \"$runtime_root\"\n\"$runtime_root/python/bin/python3\" -I -c 'import sys; assert sys.version_info[:3] == (3, 12, 12)'\nprintf '%s\\n' \"$runtime_root/python/bin\" >> \"$GITHUB_PATH\""
        },
        {
          "name": "Install locked source test dependency",
          "run": "python3 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/ci-requirements.txt"
        },
        {
          "name": "Run interop-portability",
          "id": "verify",
          "env": {
            "CI_HEAD_SHA": "${{ github.event.pull_request.head.sha }}",
            "CI_BASE_SHA": "${{ github.event.pull_request.base.sha }}"
          },
          "run": "python3 -I -B scripts/verify.py shard --shard interop-portability"
        }
      ],
      "if": "${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}"
    },
    "context-measurement": {
      "name": "context-measurement",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "outputs": {
        "receipt": "${{ steps.verify.outputs.receipt }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install locked source test dependency",
          "run": "python3 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/ci-requirements.txt"
        },
        {
          "name": "Run context-measurement",
          "id": "verify",
          "env": {
            "CI_HEAD_SHA": "${{ github.event.pull_request.head.sha }}",
            "CI_BASE_SHA": "${{ github.event.pull_request.base.sha }}"
          },
          "run": "python3 -I -B scripts/verify.py shard --shard context-measurement"
        }
      ],
      "if": "${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}"
    },
    "review-admission": {
      "name": "review-admission",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "outputs": {
        "receipt": "${{ steps.verify.outputs.receipt }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install locked source test dependency",
          "run": "python3 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/ci-requirements.txt"
        },
        {
          "name": "Run review-admission",
          "id": "verify",
          "env": {
            "CI_HEAD_SHA": "${{ github.event.pull_request.head.sha }}",
            "CI_BASE_SHA": "${{ github.event.pull_request.base.sha }}"
          },
          "run": "python3 -I -B scripts/verify.py shard --shard review-admission"
        }
      ],
      "if": "${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}"
    },
    "ci-negative": {
      "name": "ci-negative",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "outputs": {
        "receipt": "${{ steps.verify.outputs.receipt }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Install locked source test dependency",
          "run": "python3 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/ci-requirements.txt"
        },
        {
          "name": "Run ci-negative",
          "id": "verify",
          "env": {
            "CI_HEAD_SHA": "${{ github.event.pull_request.head.sha }}",
            "CI_BASE_SHA": "${{ github.event.pull_request.base.sha }}"
          },
          "run": "python3 -I -B scripts/verify.py shard --shard ci-negative"
        }
      ],
      "if": "${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}"
    },
    "ci-required": {
      "name": "ci-required",
      "needs": [
        "owner-contracts",
        "doc-warden",
        "baseline-scaffold",
        "host-overlay-lifecycle",
        "interop-portability",
        "context-measurement",
        "review-admission",
        "ci-negative"
      ],
      "if": "${{ always() }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c",
          "with": {
            "python-version": "3.12.12"
          }
        },
        {
          "name": "Require every exact-run shard",
          "env": {
            "CI_HEAD_SHA": "${{ github.event.pull_request.head.sha }}",
            "CI_BASE_SHA": "${{ github.event.pull_request.base.sha }}",
            "CI_NEEDS": "${{ toJSON(needs) }}"
          },
          "run": "python3 -I -B scripts/verify.py aggregate"
        }
      ]
    }
  }
}
